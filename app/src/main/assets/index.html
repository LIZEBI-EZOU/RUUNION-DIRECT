<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUUNION DIRECT</title><script src="https://meet.jit.si/external_api.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#12304f;font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:28px 18px 70px}h1{margin:0 0 8px;color:#0b4ea2}.sub{color:#5d7187}
.card{background:#fff;border:1px solid #d7e5f5;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 5px 18px rgba(11,78,162,.07)}
input,button{font:inherit;border-radius:10px;padding:12px}input{width:100%;background:#fff;color:#12304f;border:1px solid #b9cee5;margin:6px 0 12px}button{border:0;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.muted{background:#fff;color:#1769e0;border:1px solid #1769e0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meet{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #e3edf8;padding:12px 0}.code{color:#0b4ea2;font-family:monospace;font-weight:700}.small{font-size:13px;color:#6a7f94}
#call{display:none;position:fixed;inset:0;background:#071a2e;z-index:10}#jitsi{position:absolute;inset:0}#leave,#share{position:absolute;z-index:11;top:14px;padding:9px 14px;background:#fff;color:#0b4ea2;border:0}#leave{left:14px}#share{right:14px}
.brand{display:inline-block;background:#0b4ea2;color:#fff;padding:8px 12px;border-radius:10px;font-weight:800;margin-bottom:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<div class="brand">RUUNION DIRECT</div><h1>Réunions vidéo directes</h1>
<p class="sub">Connectez-vous depuis le navigateur ou l'application Android avec le même code de réunion.</p>
<div class="card"><h2>Réunion instantanée</h2><div class="row"><div><label>Votre nom</label><input id="name" placeholder="Votre nom"></div><div><label>Nom de la réunion</label><input id="title" placeholder="Ma réunion"></div></div><button onclick="instant()">Démarrer maintenant</button></div>
<div class="card"><h2>Rejoindre avec un code</h2><input id="joinCode" placeholder="ex. lac-42x"><button class="muted" onclick="join()">Rejoindre</button></div>
<div class="card"><h2>Programmer</h2><input id="schedTitle" placeholder="Titre de la réunion"><input id="schedDate" type="datetime-local"><button onclick="schedule()">Programmer</button><div id="list"></div></div>
<div class="card"><h2>Options</h2><label><input id="mute" type="checkbox" checked> Arriver micro et caméra coupés</label><br><label><input id="noise" type="checkbox" checked> Suppression du bruit</label></div>
</main><div id="call"><div id="jitsi"></div><button id="leave" onclick="closeCall()">← Quitter</button><button id="share" onclick="share()">Inviter</button></div>
<script>
let api=null,currentRoom="";const key="ruunion-meetings";const words=["lac","pin","baie","val","mont","iris","cap","dune","anse","col"];
function code(){return words[Math.floor(Math.random()*words.length)]+"-"+Math.random().toString(36).slice(2,5)}
function room(c){return"ruunion-direct-"+c}
function instant(){const c=code();start(room(c),document.querySelector("#name").value||"Invité",document.querySelector("#title").value||"Réunion instantanée")}
function join(){const c=document.querySelector("#joinCode").value.trim().toLowerCase();if(c)start(room(c),prompt("Votre nom")||"Invité","RUUNION DIRECT")}
function schedule(){const title=document.querySelector("#schedTitle").value.trim()||"Réunion",date=document.querySelector("#schedDate").value;if(!date)return alert("Choisissez une date");const m={title,date,code:code()};let a=JSON.parse(localStorage.getItem(key)||"[]");a.push(m);localStorage.setItem(key,JSON.stringify(a));render()}
function render(){const a=JSON.parse(localStorage.getItem(key)||"[]"),l=document.querySelector("#list");l.innerHTML="";a.forEach(m=>{const d=document.createElement("div");d.className="meet";d.innerHTML="<div><b>"+esc(m.title)+"</b><div class='small'>"+new Date(m.date).toLocaleString("fr-FR")+"</div><div class='code'>"+m.code+"</div></div>";const b=document.createElement("button");b.textContent="Rejoindre";b.onclick=()=>start(room(m.code),prompt("Votre nom")||"Invité",m.title);d.appendChild(b);l.appendChild(d)})}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function start(r,n,t){currentRoom=r;document.querySelector("#call").style.display="block";document.querySelector("#jitsi").innerHTML="";if(api)api.dispose();const muted=document.querySelector("#mute").checked;api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:r,parentNode:document.querySelector("#jitsi"),width:"100%",height:"100%",userInfo:{displayName:n},configOverwrite:{prejoinPageEnabled:false,startWithAudioMuted:muted,startWithVideoMuted:muted,disableDeepLinking:true},interfaceConfigOverwrite:{DEFAULT_BACKGROUND:"#071a2e"}});api.executeCommand("subject",t)}
function closeCall(){if(api){api.dispose();api=null}document.querySelector("#call").style.display="none"}
function share(){const u="https://meet.jit.si/"+currentRoom,t="Rejoins-moi sur RUUNION DIRECT : "+u;if(navigator.share)navigator.share({title:"RUUNION DIRECT",text:t,url:u});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
render();
</script></body></html>

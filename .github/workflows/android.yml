name: Build RUUNION DIRECT APK
on:
 workflow_dispatch:
 push:
  paths: ["app/**","*.gradle","gradle.properties",".github/workflows/android.yml"]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v4
    with: {distribution: temurin, java-version: "17"}
  - uses: gradle/actions/setup-gradle@v4
    with: {gradle-version: "8.10.2"}
  - name: Build release
    run: gradle --no-daemon :app:assembleRelease
  - name: Sign release APK in CI
    run: |
      keytool -genkeypair -v -keystore "$RUNNER_TEMP/ruunion-release.jks" -storepass "ruunion-ci-only" -keypass "ruunion-ci-only" -alias "ruunion-release" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=RUUNION DIRECT, OU=Mobile, O=RUUNION DIRECT, C=CD"
      $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$RUNNER_TEMP/ruunion-release.jks" --ks-pass pass:ruunion-ci-only --ks-key-alias ruunion-release --key-pass pass:ruunion-ci-only --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
      $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
  - uses: actions/upload-artifact@v4
    with: {name: ruunion-direct-release-apk, path: app/build/outputs/apk/release/app-release.apk, retention-days: 90}
  - name: Build debug
    run: gradle --no-daemon :app:assembleDebug
  - uses: actions/upload-artifact@v4
    with: {name: ruunion-direct-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk}

name: Deploy RUUNION DIRECT Web
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare web site
        run: |
          rm -rf site
          mkdir -p site
          cp app/src/main/assets/index.html site/index.html
          cp app/src/main/assets/ruunion-logo.png site/ruunion-logo.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
